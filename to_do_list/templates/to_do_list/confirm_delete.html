{% extends "to_do_list/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<header class="page-heading">
  <div>
    <p class="eyebrow">TODO LIST</p>
    <h1>{{ title }}</h1>
  </div>
</header>
<section class="form-panel">
  <p class="mb-4">Are you sure you want to delete <strong>{{ object }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-light" href="{% url cancel_url %}">Cancel</a>
  </form>
</section>
{% endblock %}
